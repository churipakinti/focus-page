<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f2027">
  <title>Focus</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html { background: #0f2027; color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 2rem 1.5rem;
      background: linear-gradient(125deg, #051b23 0%, #143944 50%, #2d687b 100%);
      color: #f1f5f3;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(1.25rem, 1.55vw, 1.625rem);
      width: 100%;
    }
    .leaf {
      display: block;
      width: clamp(5.5rem, 7.6vw, 8rem);
      height: auto;
      flex: none;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.65rem, 2.87vw, 3rem);
      font-weight: 500;
      line-height: 1.35;
      letter-spacing: -0.025em;
      text-wrap: balance;
      animation: text-breathe 9s ease-in-out infinite;
    }

    @keyframes text-breathe {
      0%, 100% { opacity: 0.85; }
      45% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      h1 { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <img class="leaf" src="assets/leaf-hires.png" width="1254" height="1254" alt="" decoding="async">
    <h1>Stay focused, be present!</h1>
  </main>
</body>
</html>
