<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1114">
  <title>Focus</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    html {
      background: #0b1114;
      color-scheme: dark;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background: radial-gradient(
        ellipse at 50% 40%,
        #182d32 0%,
        #101c20 45%,
        #0b1114 100%
      );
      color: #e6edea;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(1.75rem, 5vh, 2.75rem);
      width: 100%;
      max-width: 42rem;
    }

    .leaf {
      width: clamp(2.5rem, 6vw, 3rem);
      height: auto;
      color: #98b9a7;
      opacity: 0.85;
      animation: breathe 10s ease-in-out infinite;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.75rem);
      font-weight: 400;
      line-height: 1.25;
      letter-spacing: -0.035em;
    }

    h1 span { display: block; }

    @keyframes breathe {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 0.95; }
    }

    @media (prefers-reduced-motion: reduce) {
      .leaf { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <svg class="leaf" viewBox="0 0 48 48" fill="none" aria-hidden="true">
      <path d="M39 8C26 8 12 12 12 25c0 7 5 11 11 11C36 36 39 21 39 8Z"
        stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M9 40 29 20M17 32v-9M23 26h9"
        stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h1><span>Stay focused,</span><span>be present.</span></h1>
  </main>
</body>
</html>
