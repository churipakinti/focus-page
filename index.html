<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1114">
  <title>Focus</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    html {
      background: #0b1114;
      color-scheme: dark;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background: radial-gradient(
        ellipse at 50% 40%,
        #182d32 0%,
        #101c20 45%,
        #0b1114 100%
      );
      color: #e6edea;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }

    main {
      position: relative;
      display: grid;
      place-items: center;
      width: min(100%, 46rem, 85vh);
      width: min(100%, 46rem, 85dvh);
      aspect-ratio: 1;
      isolation: isolate;
    }

    .leaf {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      color: #98b9a7;
      pointer-events: none;
      z-index: -1;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.5rem, 5.8vw, 3.5rem);
      font-weight: 400;
      line-height: 1.35;
      letter-spacing: -0.035em;
    }

    h1 span { display: block; }

  </style>
</head>
<body>
  <main>
    <svg class="leaf" viewBox="0 0 600 600" fill="none" aria-hidden="true">
      <defs>
        <radialGradient id="quiet-center">
          <stop offset="0.55" stop-color="black"/>
          <stop offset="1" stop-color="white"/>
        </radialGradient>
        <mask id="space-for-words">
          <rect width="600" height="600" fill="white"/>
          <ellipse cx="300" cy="300" rx="245" ry="108" fill="url(#quiet-center)"/>
        </mask>
      </defs>
      <path d="M492 65C325 62 126 129 112 316C103 435 171 489 275 474C439 450 483 231 492 65Z"
        fill="currentColor" fill-opacity=".025"
        stroke="currentColor" stroke-opacity=".3" stroke-width="1.4"/>
      <g mask="url(#space-for-words)" stroke="currentColor"
        stroke-width="1.2" stroke-linecap="round">
        <path d="M82 524C189 421 331 272 492 65" stroke-opacity=".4"/>
        <g stroke-opacity=".22">
          <path d="M172 432Q142 362 147 284"/>
          <path d="M226 374Q191 278 207 185"/>
          <path d="M287 304Q262 222 278 132"/>
          <path d="M353 223Q341 163 366 95"/>
          <path d="M172 432Q270 451 341 415"/>
          <path d="M226 374Q335 389 409 333"/>
          <path d="M287 304Q387 308 448 248"/>
          <path d="M353 223Q420 216 473 166"/>
        </g>
      </g>
    </svg>
    <h1><span>Stay focused,</span><span>be present.</span></h1>
  </main>
</body>
</html>
