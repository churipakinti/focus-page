<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f2027">
  <title>Focus</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html { background: #0f2027; color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 2rem 1.5rem;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #f1f5f3;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(1.5rem, 3vw, 2rem);
      width: 100%;
    }
    .leaf {
      display: block;
      width: clamp(4rem, 7vw, 5.5rem);
      height: auto;
      flex: none;
      transform-origin: 50% 85%;
      animation: breathe 9s ease-in-out infinite;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.65rem, 3.4vw, 3rem);
      font-weight: 500;
      line-height: 1.35;
      letter-spacing: -0.025em;
      text-wrap: balance;
    }
    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      45% { transform: scale(1.04); }
    }
    @media (prefers-reduced-motion: reduce) {
      .leaf { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <svg class="leaf" viewBox="0 0 100 110" fill="none" aria-hidden="true" focusable="false">
      <defs>
        <linearGradient id="right-leaf" x1="48" y1="67" x2="88" y2="9" gradientUnits="userSpaceOnUse">
          <stop stop-color="#56854e"/>
          <stop offset=".52" stop-color="#92bd69"/>
          <stop offset="1" stop-color="#c6df97"/>
        </linearGradient>
        <linearGradient id="left-leaf" x1="44" y1="75" x2="13" y2="34" gradientUnits="userSpaceOnUse">
          <stop stop-color="#4f794a"/>
          <stop offset=".6" stop-color="#8fb968"/>
          <stop offset="1" stop-color="#bbd68a"/>
        </linearGradient>
      </defs>
      <path d="M49 101C48 80 57 56 72 35" stroke="#7e9f60" stroke-width="2.7" stroke-linecap="round"/>
      <path d="M51 83C45 66 32 53 23 46" stroke="#7e9f60" stroke-width="2.3" stroke-linecap="round"/>
      <path d="M54 69C43 46 63 25 89 9C87 35 83 62 54 69Z" fill="url(#right-leaf)"/>
      <path d="M44 77C22 71 15 53 10 33C31 40 51 52 44 77Z" fill="url(#left-leaf)"/>
      <path d="M54 69C65 47 78 28 89 9" stroke="#d1e2ad" stroke-opacity=".5" stroke-width="1"/>
      <path d="M44 77C35 60 22 45 10 33" stroke="#d1e2ad" stroke-opacity=".45" stroke-width=".9"/>
      <g stroke="#d1e2ad" stroke-opacity=".23" stroke-width=".7" stroke-linecap="round">
        <path d="M62 53 60 36M69 41 69 28M76 31 78 20M62 53 77 47M69 41 82 35"/>
        <path d="M35 62 34 49M28 52 26 43M35 62 24 59"/>
      </g>
    </svg>
    <h1>Stay focused, be present!</h1>
  </main>
</body>
</html>
